<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <title>Consulta Pro | CEP & CNPJ</title>
</head>
<body>

    <div class="main-wrapper">
        <header>
            <h1>Consulta<span>Pro</span></h1>
            <p>Busca rápida de dados cadastrais brasileiros</p>
        </header>

        <div class="grid-container">
            <!-- CARD CEP -->
            <section class="card">
                <div class="card-icon">📍</div>
                <h2>Localizador de CEP</h2>
                <div class="input-group">
                    <input type="text" id="cep" placeholder="00000-000" maxlength="9">
                    <button onclick="buscarCEP()">Consultar</button>
                </div>
                <div id="resultadoCEP" class="result-area"></div>
            </section>

            <!-- CARD CNPJ -->
            <section class="card">
                <div class="card-icon">🏢</div>
                <h2>Consulta de CNPJ</h2>
                <div class="input-group">
                    <input type="text" id="cnpj" placeholder="00.000.000/0000-00">
                    <button onclick="buscarCNPJ()" class="btn-alt">Consultar</button>
                </div>
                <div id="resultadoCNPJ" class="result-area"></div>
            </section>
        </div>
    </div>

    <script>
        // FUNÇÃO CEP
        function buscarCEP() {
            const cep = document.getElementById('cep').value.replace(/\D/g, '');
            const res = document.getElementById('resultadoCEP');
            if (cep.length !== 8) return alert("CEP inválido");

            res.innerHTML = '<div class="loader"></div>';
            
            fetch(`https://viacep.com.br/ws/${cep}/json/`)
                .then(r => r.json())
                .then(data => {
                    if (data.erro) {
                        res.innerHTML = '<p class="error">CEP não encontrado.</p>';
                    } else {
                        res.innerHTML = `
                            <div class="res-box">
                                <label>Logradouro</label><span>${data.logradouro}</span>
                                <label>Bairro</label><span>${data.bairro}</span>
                                <label>Cidade/UF</label><span>${data.localidade} - ${data.uf}</span>
                            </div>`;
                    }
                });
        }

        // FUNÇÃO CNPJ (USANDO JSONP PARA EVITAR ERRO DE CORS)
        function buscarCNPJ() {
            const cnpj = document.getElementById('cnpj').value.replace(/\D/g, '');
            const res = document.getElementById('resultadoCNPJ');
            if (cnpj.length !== 14) return alert("CNPJ inválido");

            res.innerHTML = '<div class="loader"></div>';

            window.receitaCallback = function(data) {
                if (data.status === "ERROR") {
                    res.innerHTML = `<p class="error">${data.message}</p>`;
                } else {
                    res.innerHTML = `
                        <div class="res-box">
                            <label>Razão Social</label><span>${data.nome}</span>
                            <label>Situação</label><span class="status-badge">${data.situacao}</span>
                            <label>Atividade</label><span>${data.atividade_principal[0].text}</span>
                            <label>Local</label><span>${data.municipio} - ${data.uf}</span>
                        </div>`;
                }
                document.getElementById('api-script').remove();
            };

            const script = document.createElement('script');
            script.id = 'api-script';
            script.src = `https://receitaws.com.br/v1/cnpj/${cnpj}?callback=receitaCallback`;
            document.body.appendChild(script);
        }
    </script>
</body>
</html>
